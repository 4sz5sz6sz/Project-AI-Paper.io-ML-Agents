behaviors:
  CNN_LSTM_Agent:
    trainer_type: ppo
    hyperparameters:
      # 배치 크기 증가 (안정적인 학습)
      batch_size: 1024
      buffer_size: 10240
      
      # 학습률 감소 (더 안정적인 학습)
      learning_rate: 1.0e-4
      learning_rate_schedule: linear
      
      # 엔트로피 계수 증가 (탐험 증가)
      beta: 1.0e-2
      
      # PPO 클리핑 범위 감소 (안정성)
      epsilon: 0.15
      
      # GAE 람다 (보상 추정 정확도)
      lambd: 0.95
      
      # 에폭 수 증가 (더 많은 업데이트)
      num_epoch: 5
    
    network_settings:
      # 정규화 활성화 (입력 안정화)
      normalize: true
      
      # 네트워크 크기 증가 (복잡한 전략 학습)
      hidden_units: 512
      num_layers: 3
      
      # CNN 인코더 설정
      vis_encode_type: simple
      
      # LSTM 메모리 설정
      memory:
        memory_size: 128
        sequence_length: 32
    
    reward_signals:
      extrinsic:
        # 할인 계수 (미래 보상 중요도)
        gamma: 0.99
        strength: 1.0
      
      # 호기심 보상 추가 (탐험 장려)
      curiosity:
        gamma: 0.99
        strength: 0.01
        encoding_size: 128
        learning_rate: 3.0e-4
    
    # 학습 스텝 수
    max_steps: 10000000
    
    # 타임 호라이즌 증가 (긴 에피소드 대응)
    time_horizon: 64
    
    # 요약 빈도
    summary_freq: 5000
    
    # 체크포인트 설정
    checkpoint_interval: 100000
    keep_checkpoints: 5
    
    # Self-Play 설정 (에이전트끼리 경쟁)
    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 50000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200.0
